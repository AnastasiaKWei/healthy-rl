# Stage 3: residual-stream activations for the emotion and neutral story corpora.
#
# Runs on a compute node against an already-running vllm-lens server serving `model`.
# One model per invocation (`--model`); the server must serve that same checkpoint.
stage: extract_acts
version: v1
model_dir: ${MODEL_DIR}
model: gemma-4-31B-it

# Stage 1's output. The text column is `story`, NOT `text`.
stories_dir: ${ARTIFACT_DIR}/stories/v1
stories_file: stories.parquet
neutral_file: neutral_stories.parquet
emotion_column: emotion
text_column: story

# Pooling window. The reference method averages "across all token positions within each
# story, beginning with the 50th token"; stories with fewer than `min_tokens` prompt
# tokens have too small a window to be worth keeping and are skipped and counted.
skip_positions: 50
min_tokens: 60

# Prefill only: one sampled token is the cheapest way to force a forward pass.
max_tokens: 1

# How many stories to use. Stage 1 verified 1200 per emotion and 1200 neutral.
stories_per_emotion: 1200
n_neutral: 1200

# Concurrency: `batch_size` requests are in flight at once, then all of them are
# accumulated before the next slice starts. That keeps the resume cursor exact.
batch_size: 32
request_timeout_s: 600
max_attempts: 5

# Checkpoint the accumulators every N stories so a killed overnight job resumes.
checkpoint_every: 200

# Abort when more than this fraction of requests fail: at that point the server is
# unhealthy and the remaining hours would produce a quietly biased mean.
max_failure_rate: 0.02
min_failure_sample: 50

# Must match the vLLM server's --max-model-len (slurm/serve.slurm reads this key).
max_model_len: 8192
gpu_memory_utilization: 0.90

# Fixed order. This list defines the emotion axis of every downstream artifact.
emotions:
  - calm
  - desperate
  - nervous
  - angry
  - afraid
  - joyful
  - guilty
  - proud
  - loving
  - sad
  - hostile
  - frustrated
  - exasperated
  - overwhelmed
