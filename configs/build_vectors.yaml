# Stage 4: emotion directions from stage 3's activation statistics. CPU / login node.
stage: build_vectors
version: v1
model: gemma-4-31B-it

# Which stage 3 artifact to read ($ARTIFACT_DIR/activations/<model>/<version>).
activations_version: v1

# Remove the fewest top principal components of the neutral covariance that together
# cover this fraction of its variance. The reference method uses 50%.
var_frac: 0.5

# Summarise the neutral eigenvalue spectrum in vectors.json. Costs one extra
# eigvalsh per layer; worth it, because n_removed is meaningless without it.
spectrum_diagnostics: true

# Optional cross-check: if set, must equal the order stage 3 actually accumulated.
emotions:
  - calm
  - desperate
  - nervous
  - angry
  - afraid
  - joyful
  - guilty
  - proud
  - loving
  - sad
  - hostile
  - frustrated
  - exasperated
  - overwhelmed
