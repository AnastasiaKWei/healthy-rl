# Stage 0: can vllm-lens actually hook THIS architecture?
#
# Runs on a compute node against an already-running server. One model per invocation
# (`--model`); the server must be serving that same checkpoint.
stage: smoke
version: v1
model_dir: ${MODEL_DIR}
model: Qwen3.6-27B

prompt: "Write one sentence about a deadline that is about to be missed."
max_tokens: 32
steer_max_tokens: 256
seed: 1234
steer_scale: 0.5
norm_match: true
temperature: 0.0
request_timeout_s: 600

# Controller override. The default 32-token steer check compares greedy TEXT, and
# Qwen3.6 opens every response with a deterministic "<think>\nThinking Process:"
# preamble, so a real steering effect can be invisible inside 32 tokens. 256 tokens
# gets generation past the preamble and makes the comparison meaningful.
