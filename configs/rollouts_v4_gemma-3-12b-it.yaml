# Mindset v4 readout: gemma-3-12b-it on the SOLVABLE split, thinking in
# <scratchpad> tags granted by the instruction itself (not the
# scratchpad_reasoning system prompt -- v4 owns the system channel).
#
# Same five-arm structure as rollouts_v4_Qwen3-14B.yaml; see there for the
# shared rationale. Differences: the original (solvable) split, the scratchpad
# channel, and the solvable note in turn 1 ("A correct implementation exists"),
# all per docs/prompts/v4.md's Gemma section.
stage: rollouts
version: v1

serve:
  max_model_len: 12288
  gpu_memory_utilization: 0.92
  max_num_seqs: 8

use_hf_dataset: false
sandbox: local
max_attempts: 5
message_limit: 40

# The solvable split: stage 2's fetch_bench_original.yaml stages this parquet.
bench_parquet: ${ARTIFACT_DIR}/bench/v1/original.parquet

readout_problems: 24
samples_per_problem:
  1: 6
tier2_emotions: []
tier3_emotions: []

# --- mindset v4 ---------------------------------------------------------------
mindset_version: 4
v4_channel: scratchpad
v4_solvable_note: true
scratchpad_reasoning: false
affect_prompt: false
# mindset: appended per arm by scripts/run_v4_arms.sh

temperature: 1.0
top_p: 1.0
max_tokens: 2048

max_connections: 8
max_samples: 8
max_subprocesses: 8
max_sandboxes: 8

residual_layers: probe
save_residuals: true

preflight_prompt: "Write one sentence about a deadline that is about to be missed."
preflight_max_tokens: 16
